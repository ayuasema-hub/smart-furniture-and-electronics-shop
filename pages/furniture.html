<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture | Furniture Roomstore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/products.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>
<body>
    <header class="navbar"></header>
    <main class="container home-section">
        <nav class="shop-breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Furniture</span></nav>
        <h1>Furniture</h1>
        <p>Browse furniture in the current catalogue by room and product type.</p>
        <nav class="room-links" aria-label="Furniture categories"><a href="shop.html?category=sofa">Sofas &amp; seating</a><a href="shop.html?category=bed">Beds &amp; bedroom</a><a href="shop.html?category=dining">Dining</a><a href="shop.html?room=office">Home office</a><a href="shop.html?room=outdoor">Outdoor</a><a href="shop.html?category=table">Tables &amp; desks</a></nav>
        <div class="section-header"><h2 class="section-title">Furniture collection</h2></div>
        <div class="product-grid" id="departmentGrid"></div>
    </main>
    <footer class="footer"></footer>
    <script>document.addEventListener('DOMContentLoaded', () => renderProductCollection('#departmentGrid', product => getProductDepartment(product) === 'furniture', 12));</script>
</body>
</html>
